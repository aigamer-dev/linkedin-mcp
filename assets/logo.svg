<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#12203d"/>
  <!-- chain link: two interlocked rounded bars -->
  <g fill="none" stroke-width="40" stroke-linecap="round">
    <rect x="96" y="196" width="190" height="120" rx="60" stroke="#4aa3ff"/>
    <rect x="226" y="196" width="190" height="120" rx="60" stroke="#7bd88f"/>
  </g>
  <!-- protocol nodes -->
  <g stroke="#f4a261" stroke-width="10" stroke-linecap="round">
    <line x1="256" y1="122" x2="256" y2="196"/>
    <line x1="140" y1="404" x2="180" y2="316"/>
    <line x1="372" y1="404" x2="332" y2="316"/>
  </g>
  <g fill="#f4a261">
    <circle cx="256" cy="96" r="26"/>
    <circle cx="140" cy="430" r="26"/>
    <circle cx="372" cy="430" r="26"/>
  </g>
</svg>
